<!DOCTYPE html>

<html lang="ku" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kurd AI</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="app">

    <!-- Background -->

    <div class="background-glow"></div>

    <div class="bg-text">

      بژی کورد<br>

      و کوردستان

    </div>

    <!-- Header -->

    <header class="header">

      <button class="menu-button" id="menuButton">

        <span></span>

        <span></span>

        <span></span>

      </button>

      <button class="profile-button" id="profileButton">

        <span>♙</span>

      </button>

    </header>

    <!-- Main -->

    <main class="main">

      <!-- Logo -->

      <section class="hero">

        <h1>

          <span class="kurd">Kurd</span>

          <span class="ai">AI</span>

        </h1>

        <div class="gold-divider">

          <span></span>

          <b>✦</b>

          <span></span>

        </div>

        <p>دەستیارێکی زیرەکی کوردی</p>

      </section>

      <!-- Search / Chat -->

      <section class="chat-container">

        <input

          id="messageInput"

          type="text"

          placeholder="پرسیارێکت لێرە بنووسە..."

          autocomplete="off"

        >

        <button class="voice-button" id="voiceButton">

          🎙

        </button>

        <button class="send-button" id="sendButton">

          ➤

        </button>

      </section>

      <!-- AI Response -->

      <section class="ai-response">

        <div class="ai-icon">

          ✦

        </div>

        <div class="response-content">

          <strong>Kurd AI</strong>

          <p id="responseText">

            سڵاو 👋 چۆنی؟ چ شتێکت بۆ بکەم؟

          </p>

        </div>

      </section>

      <!-- Features -->

      <section class="features">

        <button class="feature-card" data-feature="chat">

          <div class="feature-icon">

            💬

          </div>

          <h3>گفتوگۆ</h3>

          <p>

            گفتوگۆی زیرەک

          </p>

        </button>

        <button class="feature-card" data-feature="image">

          <div class="feature-icon">

            ▧

          </div>

          <h3>دروستکردنی وێنە</h3>

          <p>

            وێنە دروست بکە

          </p>

        </button>

        <button class="feature-card" data-feature="writing">

          <div class="feature-icon">

            ✎

          </div>

          <h3>نووسین</h3>

          <p>

            یارمەتی نووسین

          </p>

        </button>

        <button class="feature-card" data-feature="translate">

          <div class="feature-icon">

            A文

          </div>

          <h3>وەرگێڕان</h3>

          <p>

            وەرگێڕانی دەق

          </p>

        </button>

        <button class="feature-card" data-feature="study">

          <div class="feature-icon">

            📖

          </div>

          <h3>یارمەتی خوێندن</h3>

          <p>

            فێربوون و خوێندن

          </p>

        </button>

        <button class="feature-card" data-feature="code">

          <div class="feature-icon code-icon">

            &lt;/&gt;

          </div>

          <h3>کۆدنوسین</h3>

          <p>

            یارمەتی کۆد

          </p>

        </button>

        <button class="feature-card" data-feature="voice">

          <div class="feature-icon">

            🎙

          </div>

          <h3>دەنگ</h3>

          <p>

            گفتوگۆی دەنگی

          </p>

        </button>

        <button class="feature-card" data-feature="more">

          <div class="feature-icon">

            ☆

          </div>

          <h3>زۆرتر</h3>

          <p>

            تایبەتمەندی زۆرتر

          </p>

        </button>

      </section>

      <!-- Pro -->

      <section class="pro-card">

        <div class="pro-icon">

          ♛

        </div>

        <div class="pro-text">

          <h3>

            Kurd AI Pro

          </h3>

          <p>

            ئەزموونێکی زیاتر و بەهێزتر

          </p>

        </div>

        <button id="proButton">

          بینین

        </button>

      </section>

    </main>

    <!-- Bottom Navigation -->

    <nav class="bottom-navigation">

      <button class="nav-button active" data-page="home">

        <span>⌂</span>

        <small>

          سەرەکی

        </small>

      </button>

      <button class="nav-button" data-page="history">

        <span>◷</span>

        <small>

          مێژوو

        </small>

      </button>

      <button class="nav-button" data-page="favorites">

        <span>♡</span>

        <small>

          دڵخوازەکان

        </small>

      </button>

      <button class="nav-button" data-page="projects">

        <span>□</span>

        <small>

          پڕۆژەکان

        </small>

      </button>

      <button class="nav-button" data-page="settings">

        <span>⚙</span>

        <small>

          ڕێکخستن

        </small>

      </button>

    </nav>

    <!-- Menu Overlay -->

    <div class="overlay" id="overlay"></div>

    <!-- Side Menu -->

    <aside class="side-menu" id="sideMenu">

      <div class="side-menu-header">

        <div class="side-logo">

          <span>Kurd</span>

          <b>AI</b>

        </div>

        <button id="closeMenu">

          ×

        </button>

      </div>

      <div class="user-card">

        <div class="user-avatar">

          ♙

        </div>

        <div>

          <strong>

            بەخێربێیت

          </strong>

          <p>

            Kurd AI

          </p>

        </div>

      </div>

      <button class="side-item">

        <span>⌂</span>

        سەرەکی

      </button>

      <button class="side-item">

        <span>◷</span>

        مێژوو

      </button>

      <button class="side-item">

        <span>♡</span>

        دڵخوازەکان

      </button>

      <button class="side-item">

        <span>□</span>

        پڕۆژەکان

      </button>

      <button class="side-item">

        <span>⚙</span>

        ڕێکخستن

      </button>

      <div class="side-footer">

        بژی کورد و کوردستان ❤️

      </div>

    </aside>

  </div>

  <script src="script.js"></script>

</body>

</html>
