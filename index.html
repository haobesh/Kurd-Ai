<!DOCTYPE html>

<html lang="ku" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kurd AI</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header class="topbar">

    <div class="brand-slogan">

      <div>بژی کورد</div>

      <div>و کوردستان</div>

    </div>

    <button class="icon-btn" id="profileBtn">

      ♙

    </button>

    <button class="menu-btn" id="menuBtn">

      <span></span>

      <span></span>

      <span></span>

    </button>

  </header>

  <main class="main">

    <!-- LOGO -->

    <section class="hero">

      <div class="logo">

        <span class="kurd">Kurd</span>

        <span class="ai">AI</span>

      </div>

      <div class="sparkle">✦</div>

      <p class="subtitle">

        دەستیارێکی زیرەکی کوردی

      </p>

    </section>

    <!-- CHAT INPUT -->

    <section class="chat-box">

      <input

        type="text"

        id="messageInput"

        placeholder="پرسیارێکت لێرە بنووسە..."

      >

      <button class="mic-btn" id="micBtn">

        🎙️

      </button>

      <button class="send-btn" id="sendBtn">

        ➤

      </button>

    </section>

    <!-- AI MESSAGE -->

    <section class="ai-message">

      <div class="ai-icon">✦</div>

      <div>

        <div class="ai-name">Kurd AI</div>

        <p>

          سڵاو 👋 چۆنی؟ چ شتێکت بۆ بکەم؟

        </p>

      </div>

    </section>

    <!-- FEATURES -->

    <section class="features">

      <button class="feature" data-text="گفتوگۆی زیرەک">

        <span class="feature-icon">💬</span>

        <strong>گفتوگۆ</strong>

        <small>گفتوگۆی زیرەک</small>

      </button>

      <button class="feature" data-text="دروستکردنی وێنە">

        <span class="feature-icon">▧</span>

        <strong>دروستکردنی وێنە</strong>

        <small>وێنە دروست بکە</small>

      </button>

      <button class="feature" data-text="نووسین">

        <span class="feature-icon">✎</span>

        <strong>نووسین</strong>

        <small>یارمەتی نووسین</small>

      </button>

      <button class="feature" data-text="وەرگێڕان">

        <span class="feature-icon">A文</span>

        <strong>وەرگێڕان</strong>

        <small>وەرگێڕانی دەق</small>

      </button>

      <button class="feature" data-text="یارمەتی خوێندن">

        <span class="feature-icon">📖</span>

        <strong>یارمەتی خوێندن</strong>

        <small>فێربوون و خوێندن</small>

      </button>

      <button class="feature" data-text="کۆدنوسین">

        <span class="feature-icon">&lt;/&gt;</span>

        <strong>کۆدنوسین</strong>

        <small>یارمەتی کۆد</small>

      </button>

      <button class="feature" data-text="دەنگ">

        <span class="feature-icon">🎙️</span>

        <strong>دەنگ</strong>

        <small>گفتوگۆی دەنگی</small>

      </button>

      <button class="feature" data-text="زۆرتر">

        <span class="feature-icon">☆</span>

        <strong>زۆرتر</strong>

        <small>تایبەتمەندی زیاتر</small>

      </button>

    </section>

    <!-- PRO -->

    <section class="pro">

      <div class="pro-crown">♛</div>

      <h2>Kurd AI Pro</h2>

      <p>

        ئەزموونێکی زیاتر و بەهێزتر

      </p>

      <button id="proBtn">

        ببینە

      </button>

    </section>

  </main>

  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <button class="nav-item active" data-page="home">

      <span>⌂</span>

      <small>سەرەکی</small>

    </button>

    <button class="nav-item" data-page="menu">

      <span>◷</span>

      <small>مێژوو</small>

    </button>

    <button class="nav-item" data-page="favorites">

      <span>♡</span>

      <small>دڵخوازەکان</small>

    </button>

    <button class="nav-item" data-page="projects">

      <span>□</span>

      <small>پڕۆژەکان</small>

    </button>

    <button class="nav-item" data-page="settings">

      <span>⚙</span>

      <small>ڕێکخستن</small>

    </button>

  </nav>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>

</body>

</html>
