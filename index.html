<!DOCTYPE html>

<html lang="ku" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

  >

  <meta name="theme-color" content="#050505">

  <title>Kurd AI</title>

  <!-- CSS -->

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="app">

    <!-- Background -->

    <div class="bg-glow"></div>

    <div class="bg-slogan">

      بژی کورد<br>

      و کوردستان

    </div>

    <!-- Header -->

    <header class="header">

      <button class="menu-btn" id="menuBtn" aria-label="Menu">

        <span></span>

        <span></span>

        <span></span>

      </button>

      <button class="profile-btn" id="profileBtn" aria-label="Profile">

        <span class="profile-icon">♙</span>

      </button>

    </header>

    <!-- Main -->

    <main class="main">

      <!-- Logo -->

      <section class="hero">

        <div class="logo">

          <span class="kurd">Kurd</span>

          <span class="ai">AI</span>

        </div>

        <div class="gold-line">

          <span></span>

          <b>✦</b>

          <span></span>

        </div>

        <p class="subtitle">

          دەستیارێکی زیرەکی کوردی

        </p>

      </section>

      <!-- Chat -->

      <section class="chat-box">

        <input

          type="text"

          id="promptInput"

          placeholder="پرسیارێکت لێرە بنووسە..."

          autocomplete="off"

        >

        <button

          class="mic-btn"

          id="micBtn"

          aria-label="Voice"

        >

          🎙

        </button>

        <button

          class="send-btn"

          id="sendBtn"

          aria-label="Send"

        >

          ➤

        </button>

      </section>

      <!-- AI Response -->

      <section class="response-box" id="responseBox">

        <div class="ai-avatar">

          ✦

        </div>

        <div class="response-content">

          <strong>Kurd AI</strong>

          <p id="responseText">

            سڵاو 👋 چۆنی؟ چ شتێکت بۆ بکەم؟

          </p>

        </div>

      </section>

      <!-- Features -->

      <section class="features">

        <button

          class="feature-card"

          data-feature="chat"

        >

          <div class="feature-icon">💬</div>

          <h3>گفتوگۆ</h3>

          <p>گفتوگۆی زیرەک</p>

        </button>

        <button

          class="feature-card"

          data-feature="image"

        >

          <div class="feature-icon">▧</div>

          <h3>دروستکردنی وێنە</h3>

          <p>وێنە دروست بکە</p>

        </button>

        <button

          class="feature-card"

          data-feature="writing"

        >

          <div class="feature-icon">✎</div>

          <h3>نووسین</h3>

          <p>یارمەتی نووسین</p>

        </button>

        <button

          class="feature-card"

          data-feature="translate"

        >

          <div class="feature-icon">A文</div>

          <h3>وەرگێڕان</h3>

          <p>وەرگێڕانی دەق</p>

        </button>

        <button

          class="feature-card"

          data-feature="study"

        >

          <div class="feature-icon">▢</div>

          <h3>یارمەتی خوێندن</h3>

          <p>فێربوون و خوێندن</p>

        </button>

        <button

          class="feature-card"

          data-feature="code"

        >

          <div class="feature-icon">&lt;/&gt;</div>

          <h3>کۆدنوسین</h3>

          <p>یارمەتی کۆد</p>

        </button>

        <button

          class="feature-card"

          data-feature="voice"

        >

          <div class="feature-icon">🎙</div>

          <h3>دەنگ</h3>

          <p>گفتوگۆی دەنگی</p>

        </button>

        <button

          class="feature-card"

          data-feature="more"

        >

          <div class="feature-icon">☆</div>

          <h3>زۆرتر</h3>

          <p>تایبەتمەندی زۆرتر</p>

        </button>

      </section>

      <!-- Pro -->

      <section class="pro-card">

        <div class="crown">

          ♛

        </div>

        <div class="pro-info">

          <h3>Kurd AI Pro</h3>

          <p>

            ئەزموونێکی زیاتر و بەهێزتر

          </p>

        </div>

        <button id="proBtn">

          بینین

        </button>

      </section>

    </main>

    <!-- Bottom Navigation -->

    <nav class="bottom-nav">

      <button

        class="nav-item active"

        data-nav="home"

      >

        <span>⌂</span>

        <small>سەرەکی</small>

      </button>

      <button

        class="nav-item"

        data-nav="history"

      >

        <span>◷</span>

        <small>مێژوو</small>

      </button>

      <button

        class="nav-item"

        data-nav="favorites"

      >

        <span>♡</span>

        <small>دڵخوازەکان</small>

      </button>

      <button

        class="nav-item"

        data-nav="projects"

      >

        <span>□</span>

        <small>پڕۆژەکان</small>

      </button>

      <button

        class="nav-item"

        data-nav="settings"

      >

        <span>⚙</span>

        <small>ڕێکخستن</small>

      </button>

    </nav>

    <!-- Overlay -->

    <div

      class="overlay"

      id="overlay"

    ></div>

    <!-- Side Menu -->

    <aside

      class="side-menu"

      id="sideMenu"

    >

      <div class="side-header">

        <div class="side-logo">

          <span>Kurd</span>

          <b>AI</b>

        </div>

        <button

          class="close-menu"

          id="closeMenu"

        >

          ×

        </button>

      </div>

      <div class="side-user">

        <div class="avatar">

          ♙

        </div>

        <div>

          <strong>بەخێربێیت</strong>

          <p>Kurd AI</p>

        </div>

      </div>

      <button class="menu-item">

        <span>⌂</span>

        <b>سەرەکی</b>

      </button>

      <button class="menu-item">

        <span>◷</span>

        <b>مێژوو</b>

      </button>

      <button class="menu-item">

        <span>♡</span>

        <b>دڵخوازەکان</b>

      </button>

      <button class="menu-item">

        <span>□</span>

        <b>پڕۆژەکان</b>

      </button>

      <button class="menu-item">

        <span>⚙</span>

        <b>ڕێکخستن</b>

      </button>

      <div class="menu-footer">

        بژی کورد و کوردستان ❤️

      </div>

    </aside>

  </div>

  <!-- JavaScript -->

  <script src="script.js"></script>

</body>

</html>
