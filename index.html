<div class="app">

  <!-- Background slogan -->

  <div class="bg-slogan">

    بژی کورد<br>

    و کوردستان

  </div>

  <!-- Header -->

  <header class="header">

    <button class="icon-btn" id="menuBtn">

      <span></span>

      <span></span>

      <span></span>

    </button>

    <div class="profile-btn" id="profileBtn">

      <span>♙</span>

    </div>

  </header>

  <!-- Main -->

  <main class="main">

    <!-- Logo -->

    <section class="hero">

      <h1>

        <span class="kurd">Kurd</span>

        <span class="ai">AI</span>

      </h1>

      <div class="gold-line">

        <i></i>

        <span>✦</span>

        <i></i>

      </div>

      <p>دەستیارێکی زیرەکی کوردی</p>

    </section>

    <!-- Chat Box -->

    <section class="chat-box">

      <input

        type="text"

        id="promptInput"

        placeholder="پرسیارێکت لێرە بنووسە..."

        autocomplete="off"

      />

      <button class="mic-btn" id="micBtn" title="دەنگ">

        🎙

      </button>

      <button class="send-btn" id="sendBtn" title="ناردن">

        ➤

      </button>

    </section>

    <!-- Response -->

    <div class="response" id="response">

      <div class="response-icon">✦</div>

      <div>

        <strong>Kurd AI</strong>

        <p id="responseText">

          سڵاو 👋 چۆنی؟ چ شتێکت بۆ بکەم؟

        </p>

      </div>

    </div>

    <!-- Features -->

    <section class="features">

      <button class="feature-card" data-feature="chat">

        <div class="feature-icon">💬</div>

        <h3>گفتوگۆ</h3>

        <p>گفتوگۆی زیرەک</p>

      </button>

      <button class="feature-card" data-feature="image">

        <div class="feature-icon">▧</div>

        <h3>دروستکردنی وێنە</h3>

        <p>وێنە دروست بکە</p>

      </button>

      <button class="feature-card" data-feature="writing">

        <div class="feature-icon">✎</div>

        <h3>نووسین</h3>

        <p>یارمەتی نووسین</p>

      </button>

      <button class="feature-card" data-feature="translate">

        <div class="feature-icon">A文</div>

        <h3>وەرگێڕان</h3>

        <p>وەرگێڕانی دەق</p>

      </button>

      <button class="feature-card" data-feature="study">

        <div class="feature-icon">▢</div>

        <h3>یارمەتی خوێندن</h3>

        <p>فێربوون و خوێندن</p>

      </button>

      <button class="feature-card" data-feature="code">

        <div class="feature-icon">&lt;/&gt;</div>

        <h3>کۆدنوسین</h3>

        <p>یارمەتی کۆد</p>

      </button>

      <button class="feature-card" data-feature="voice">

        <div class="feature-icon">🎙</div>

        <h3>دەنگ</h3>

        <p>گفتوگۆی دەنگی</p>

      </button>

      <button class="feature-card" data-feature="favorite">

        <div class="feature-icon">☆</div>

        <h3>زۆرتر</h3>

        <p>تایبەتمەندی زۆرتر</p>

      </button>

    </section>

    <!-- Pro -->

    <section class="pro-card">

      <div class="crown">♛</div>

      <div class="pro-info">

        <h3>Kurd AI Pro</h3>

        <p>ئەزموونێکی زیاتر و بەهێزتر</p>

      </div>

      <button id="proBtn">بینین</button>

    </section>

  </main>

  <!-- Bottom Navigation -->

  <nav class="bottom-nav">

    <button class="nav-item active" data-nav="home">

      <span>⌂</span>

      <small>سەرەکی</small>

    </button>

    <button class="nav-item" data-nav="history">

      <span>◷</span>

      <small>مێژوو</small>

    </button>

    <button class="nav-item" data-nav="favorites">

      <span>♡</span>

      <small>دڵخوازەکان</small>

    </button>

    <button class="nav-item" data-nav="projects">

      <span>□</span>

      <small>پڕۆژەکان</small>

    </button>

    <button class="nav-item" data-nav="settings">

      <span>⚙</span>

      <small>ڕێکخستن</small>

    </button>

  </nav>

  <!-- Side Menu -->

  <div class="overlay" id="overlay"></div>

  <aside class="side-menu" id="sideMenu">

    <div class="side-header">

      <div>

        <span class="side-kurd">Kurd</span>

        <span class="side-ai">AI</span>

      </div>

      <button id="closeMenu">×</button>

    </div>

    <div class="side-user">

      <div class="avatar">♙</div>

      <div>

        <strong>بەخێربێیت</strong>

        <p>Kurd AI</p>

      </div>

    </div>

    <button class="menu-item">⌂ <span>سەرەکی</span></button>

    <button class="menu-item">◷ <span>مێژوو</span></button>

    <button class="menu-item">♡ <span>دڵخوازەکان</span></button>

    <button class="menu-item">□ <span>پڕۆژەکان</span></button>

    <button class="menu-item">⚙ <span>ڕێکخستن</span></button>

    <div class="menu-footer">

      <span>بژی کورد و کوردستان ❤️</span>

    </div>

  </aside>

</div>
