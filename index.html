<!DOCTYPE html>

<html lang="ku" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"

          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#080807">

    <title>Kurd AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <button class="icon-button profile-button" id="profileBtn">

            <span>♙</span>

        </button>

        <button class="menu-button" id="menuBtn">

            <span></span>

            <span></span>

            <span></span>

        </button>

    </header>

    <!-- ================= SIDE MENU ================= -->

    <div class="menu-overlay" id="menuOverlay"></div>

    <aside class="side-menu" id="sideMenu">

        <button class="close-menu" id="closeMenu">×</button>

        <div class="menu-logo">

            <span class="gold">Kurd</span>

            <span>AI</span>

        </div>

        <div class="menu-line"></div>

        <button class="menu-item" data-page="home">

            🏠

            <span>سەرەکی</span>

        </button>

        <button class="menu-item" data-page="projects">

            □

            <span>پڕۆژەکان</span>

        </button>

        <button class="menu-item" data-page="favorites">

            ♡

            <span>دڵخوازەکان</span>

        </button>

        <button class="menu-item" data-page="history">

            ◷

            <span>مێژوو</span>

        </button>

        <button class="menu-item" data-page="settings">

            ⚙

            <span>ڕێکخستن</span>

        </button>

    </aside>

    <!-- ================= MAIN ================= -->

    <main class="app">

        <!-- Kurdish slogan -->

        <section class="slogan">

            <div>بژی کورد</div>

            <div>و کوردستان</div>

        </section>

        <!-- Logo -->

        <section class="hero">

            <div class="hero-logo">

                <div class="kurd-text">

                    Kurd

                </div>

                <div class="ai-text">

                    AI

                </div>

            </div>

            <div class="background-kurdish">

                بژی کوردستان

                <br>

                و کورد

            </div>

            <div class="gold-divider">

                <span></span>

                <b>✦</b>

                <span></span>

            </div>

            <p class="subtitle">

                دەستیارێکی زیرەکی کوردی

            </p>

        </section>

        <!-- ================= CHAT INPUT ================= -->

        <section class="chat-section">

            <div class="input-wrapper">

                <button class="send-button" id="sendBtn">

                    ➤

                </button>

                <button class="mic-button" id="micBtn">

                    🎙️

                </button>

                <input

                    type="text"

                    id="promptInput"

                    placeholder="پرسیارێکت لێرە بنووسە..."

                    autocomplete="off"

                >

            </div>

            <!-- AI response -->

            <div class="ai-message" id="aiMessage">

                <div class="ai-avatar">

                    ✦

                </div>

                <div class="ai-message-content">

                    <strong>Kurd AI</strong>

                    <p id="responseText">

                        سڵاو 👋 چۆنی؟ چ شتێک دەتوانم بۆت بکەم؟

                    </p>

                </div>

            </div>

        </section>

        <!-- ================= QUICK TOOLS ================= -->

        <section class="tools-section">

            <button class="tool-card" data-tool="chat">

                <div class="tool-icon">

                    💬

                </div>

                <h3>

                    گفتوگۆ

                </h3>

                <p>

                    گفتوگۆی زیرەک

                </p>

            </button>

            <button class="tool-card" data-tool="image">

                <div class="tool-icon">

                    ▧

                </div>

                <h3>

                    دروستکردنی وێنە

                </h3>

                <p>

                    وێنە دروست بکە

                </p>

            </button>

            <button class="tool-card" data-tool="writer">

                <div class="tool-icon">

                    ✎

                </div>

                <h3>

                    نووسین

                </h3>

                <p>

                    یارمەتی نووسین

                </p>

            </button>

            <button class="tool-card" data-tool="translate">

                <div class="tool-icon">

                    A文

                </div>

                <h3>

                    وەرگێڕان

                </h3>

                <p>

                    وەرگێڕانی دەق

                </p>

            </button>

            <button class="tool-card" data-tool="learn">

                <div class="tool-icon">

                    📖

                </div>

                <h3>

                    یارمەتی خوێندن

                </h3>

                <p>

                    فێربوون و خوێندن

                </p>

            </button>

            <button class="tool-card" data-tool="code">

                <div class="tool-icon">

                    &lt;/&gt;

                </div>

                <h3>

                    کۆدنوسین

                </h3>

                <p>

                    یارمەتی کۆد

                </p>

            </button>

            <button class="tool-card" data-tool="voice">

                <div class="tool-icon">

                    🎙️

                </div>

                <h3>

                    دەنگ

                </h3>

                <p>

                    گفتوگۆی دەنگی

                </p>

            </button>

            <button class="tool-card" data-tool="more">

                <div class="tool-icon">

                    ☆

                </div>

                <h3>

                    زۆرتر

                </h3>

                <p>

                    تایبەتمەندی زۆرتر

                </p>

            </button>

        </section>

        <!-- ================= PRO ================= -->

        <section class="pro-section">

            <div class="pro-title">

                ♛

                <span>Kurd AI Pro</span>

            </div>

            <p>

                ئەزموونێکی زیاتر و بەهێزتر

            </p>

            <button class="pro-button" id="proBtn">

                بەشداری Kurd AI Pro

            </button>

        </section>

    </main>

    <!-- ================= BOTTOM NAV ================= -->

    <nav class="bottom-nav">

        <button class="nav-item active" data-page="home">

            <span class="nav-icon">⌂</span>

            <span>

                سەرەکی

            </span>

        </button>

        <button class="nav-item" data-page="history">

            <span class="nav-icon">◷</span>

            <span>

                مێژوو

            </span>

        </button>

        <button class="nav-item" data-page="favorites">

            <span class="nav-icon">♡</span>

            <span>

                دڵخوازەکان

            </span>

        </button>

        <button class="nav-item" data-page="projects">

            <span class="nav-icon">□</span>

            <span>

                پڕۆژەکان

            </span>

        </button>

        <button class="nav-item" data-page="settings">

            <span class="nav-icon">⚙</span>

            <span>

                ڕێکخستن

            </span>

        </button>

    </nav>

    <!-- ================= MODAL ================= -->

    <div class="modal" id="modal">

        <div class="modal-box">

            <button class="modal-close" id="modalClose">

                ×

            </button>

            <div class="modal-icon">

                ✦

            </div>

            <h2 id="modalTitle">

                Kurd AI

            </h2>

            <p id="modalText">

                بەخێربێیت بۆ Kurd AI

            </p>

            <button class="modal-action" id="modalAction">

                باشە

            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
