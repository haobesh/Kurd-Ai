<!DOCTYPE html>

<html lang="ku" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

  >

  <meta name="theme-color" content="#050505">

  <title>Kurd AI</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="app">

    <!-- ================= BACKGROUND ================= -->

    <div class="background-text">

      بژی کورد<br>

      و کوردستان

    </div>

    <div class="gold-glow"></div>

    <!-- ================= HEADER ================= -->

    <header class="header">

      <button

        class="profile-btn"

        id="profileBtn"

        type="button"

      >

        ♙

      </button>

      <button

        class="menu-btn"

        id="menuBtn"

        type="button"

      >

        <span></span>

        <span></span>

        <span></span>

      </button>

    </header>

    <!-- ================= MAIN ================= -->

    <main class="main">

      <!-- LOGO -->

      <section class="hero">

        <div class="logo">

          <div class="kurd">

            Kurd

          </div>

          <div class="ai">

            AI

          </div>

        </div>

        <div class="decoration">

          <span></span>

          <b>✦</b>

          <span></span>

        </div>

        <p class="subtitle">

          دەستیارێکی زیرەکی کوردی

        </p>

      </section>

      <!-- ================= INPUT ================= -->

      <section class="chat-area">

        <div class="input-box">

          <input

            id="messageInput"

            type="text"

            placeholder="پرسیارێکت لێرە بنووسە..."

            autocomplete="off"

          >

          <button

            class="voice-btn"

            id="voiceBtn"

            type="button"

          >

            🎙️

          </button>

          <button

            class="send-btn"

            id="sendBtn"

            type="button"

          >

            ➤

          </button>

        </div>

      </section>

      <!-- ================= AI RESPONSE ================= -->

      <section class="ai-response">

        <div class="ai-avatar">

          ✦

        </div>

        <div class="response-content">

          <div class="response-name">

            Kurd AI

          </div>

          <div

            class="response-message"

            id="responseMessage"

          >

            سڵاو 👋 چۆنی؟ چ شتێکت بۆ بکەم؟

          </div>

        </div>

      </section>

      <!-- ================= FEATURES ================= -->

      <section class="features">

        <!-- 1 -->

        <button

          class="feature"

          data-feature="chat"

          type="button"

        >

          <div class="feature-icon">

            💬

          </div>

          <strong>

            گفتوگۆ

          </strong>

          <small>

            گفتوگۆی زیرەک

          </small>

        </button>

        <!-- 2 -->

        <button

          class="feature"

          data-feature="image"

          type="button"

        >

          <div class="feature-icon">

            ▧

          </div>

          <strong>

            دروستکردنی وێنە

          </strong>

          <small>

            وێنە دروست بکە

          </small>

        </button>

        <!-- 3 -->

        <button

          class="feature"

          data-feature="writing"

          type="button"

        >

          <div class="feature-icon">

            ✎

          </div>

          <strong>

            نووسین

          </strong>

          <small>

            یارمەتی نووسین

          </small>

        </button>

        <!-- 4 -->

        <button

          class="feature"

          data-feature="translate"

          type="button"

        >

          <div class="feature-icon">

            A文

          </div>

          <strong>

            وەرگێڕان

          </strong>

          <small>

            وەرگێڕانی دەق

          </small>

        </button>

        <!-- 5 -->

        <button

          class="feature"

          data-feature="study"

          type="button"

        >

          <div class="feature-icon">

            📖

          </div>

          <strong>

            یارمەتی خوێندن

          </strong>

          <small>

            فێربوون و خوێندن

          </small>

        </button>

        <!-- 6 -->

        <button

          class="feature"

          data-feature="code"

          type="button"

        >

          <div class="feature-icon">

            &lt;/&gt;

          </div>

          <strong>

            کۆدنوسین

          </strong>

          <small>

            یارمەتی کۆد

          </small>

        </button>

        <!-- 7 -->

        <button

          class="feature"

          data-feature="voice"

          type="button"

        >

          <div class="feature-icon">

            🎙️

          </div>

          <strong>

            دەنگ

          </strong>

          <small>

            گفتوگۆی دەنگی

          </small>

        </button>

        <!-- 8 -->

        <button

          class="feature"

          data-feature="more"

          type="button"

        >

          <div class="feature-icon">

            ☆

          </div>

          <strong>

            زۆرتر

          </strong>

          <small>

            تایبەتمەندی زیاتر

          </small>

        </button>

      </section>

      <!-- ================= PRO ================= -->

      <section class="pro-card">

        <div class="pro-crown">

          ♛

        </div>

        <div class="pro-info">

          <h3>

            Kurd AI Pro

          </h3>

          <p>

            ئەزموونێکی زیاتر و بەهێزتر

          </p>

        </div>

        <button

          id="proBtn"

          type="button"

        >

          بینین

        </button>

      </section>

    </main>

    <!-- ================= BOTTOM NAVIGATION ================= -->

    <nav class="bottom-nav">

      <button

        class="nav-item active"

        data-page="home"

        type="button"

      >

        <span>⌂</span>

        <small>

          سەرەکی

        </small>

      </button>

      <button

        class="nav-item"

        data-page="history"

        type="button"

      >

        <span>◷</span>

        <small>

          مێژوو

        </small>

      </button>

      <button

        class="nav-item"

        data-page="favorites"

        type="button"

      >

        <span>♡</span>

        <small>

          دڵخوازەکان

        </small>

      </button>

      <button

        class="nav-item"

        data-page="projects"

        type="button"

      >

        <span>□</span>

        <small>

          پڕۆژەکان

        </small>

      </button>

      <button

        class="nav-item"

        data-page="settings"

        type="button"

      >

        <span>⚙</span>

        <small>

          ڕێکخستن

        </small>

      </button>

    </nav>

    <!-- ================= OVERLAY ================= -->

    <div

      class="overlay"

      id="overlay"

    ></div>

    <!-- ================= SIDE MENU ================= -->

    <aside

      class="side-menu"

      id="sideMenu"

    >

      <div class="menu-header">

        <div class="menu-logo">

          <span>Kurd</span>

          <b>AI</b>

        </div>

        <button

          class="close-menu"

          id="closeMenu"

          type="button"

        >

          ×

        </button>

      </div>

      <div class="menu-user">

        <div class="user-avatar">

          ♙

        </div>

        <div>

          <strong>

            بەخێربێیت

          </strong>

          <small>

            Kurd AI

          </small>

        </div>

      </div>

      <button

        class="menu-item"

        data-menu="home"

        type="button"

      >

        <span>⌂</span>

        سەرەکی

      </button>

      <button

        class="menu-item"

        data-menu="history"

        type="button"

      >

        <span>◷</span>

        مێژوو

      </button>

      <button

        class="menu-item"

        data-menu="favorites"

        type="button"

      >

        <span>♡</span>

        دڵخوازەکان

      </button>

      <button

        class="menu-item"

        data-menu="projects"

        type="button"

      >

        <span>□</span>

        پڕۆژەکان

      </button>

      <button

        class="menu-item"

        data-menu="settings"

        type="button"

      >

        <span>⚙</span>

        ڕێکخستن

      </button>

      <div class="menu-footer">

        بژی کورد و کوردستان ❤️

      </div>

    </aside>

    <!-- ================= MODAL ================= -->

    <div

      class="modal"

      id="modal"

    >

      <div class="modal-box">

        <button

          class="modal-close"

          id="modalClose"

          type="button"

        >

          ×

        </button>

        <div class="modal-icon">

          ✦

        </div>

        <h2 id="modalTitle">

          Kurd AI

        </h2>

        <p id="modalText">

          بەخێربێیت بۆ Kurd AI

        </p>

        <button

          class="modal-action"

          id="modalAction"

          type="button"

        >

          باشە

        </button>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
