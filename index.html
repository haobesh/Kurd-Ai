<!DOCTYPE html>

<html lang="ku" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

  >

  <meta name="theme-color" content="#080807">

  <title>Kurd AI</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- =========================

       APP

  ========================== -->

  <div class="app">

    <!-- TOP BAR -->

    <header class="topbar">

      <button class="icon-btn profile-btn" id="profileBtn" aria-label="پڕۆفایل">

        <span>♙</span>

      </button>

      <div class="brand-mini">

        <div>بژی کورد</div>

        <div>و کوردستان</div>

      </div>

      <button class="icon-btn menu-btn" id="menuBtn" aria-label="مێنیو">

        <span></span>

        <span></span>

        <span></span>

      </button>

    </header>

    <!-- MENU -->

    <div class="menu-overlay" id="menuOverlay">

      <div class="side-menu">

        <button class="close-menu" id="closeMenu">×</button>

        <div class="menu-logo">

          <span class="gold">Kurd</span>

          <span class="white">AI</span>

        </div>

        <button class="menu-item" data-section="home">

          <span>⌂</span>

          سەرەکی

        </button>

        <button class="menu-item" data-section="favorites">

          <span>♡</span>

          دڵخوازەکان

        </button>

        <button class="menu-item" data-section="projects">

          <span>□</span>

          پڕۆژەکان

        </button>

        <button class="menu-item" data-section="settings">

          <span>⚙</span>

          ڕێکخستن

        </button>

      </div>

    </div>

    <!-- MAIN -->

    <main id="mainContent">

      <!-- HERO -->

      <section class="hero">

        <div class="hero-bg-text">

          بژی کورد

          <br>

          و کوردستان

        </div>

        <h1 class="logo">

          <span class="kurd">Kurd</span>

          <span class="ai">AI</span>

        </h1>

        <div class="gold-line">

          <span>✦</span>

        </div>

        <p class="subtitle">

          دەستیارێکی زیرەکی کوردی

        </p>

      </section>

      <!-- CHAT BOX -->

      <section class="chat-area">

        <div class="input-row">

          <button

            class="send-btn"

            id="sendBtn"

            aria-label="ناردن"

          >

            ➤

          </button>

          <button

            class="mic-btn"

            id="micBtn"

            aria-label="دەنگ"

          >

            🎙️

          </button>

          <input

            type="text"

            id="userInput"

            placeholder="پرسیارێکت لێرە بنووسە..."

            autocomplete="off"

          >

        </div>

        <!-- AI MESSAGE -->

        <div class="ai-message">

          <div class="ai-avatar">

            ✦

          </div>

          <div class="message-content">

            <div class="ai-name">

              Kurd AI

            </div>

            <p id="aiGreeting">

              سڵاو 👋 چۆنی؟ جێ شتێکت بۆ بکەم؟

            </p>

          </div>

        </div>

        <!-- QUICK ACTIONS -->

        <div class="quick-actions">

          <button class="action-card" data-action="chat">

            <span class="action-icon">💬</span>

            <strong>گفتوگۆ</strong>

            <small>گفتوگۆی زیرەک</small>

          </button>

          <button class="action-card" data-action="image">

            <span class="action-icon">▧</span>

            <strong>دروستکردنی وێنە</strong>

            <small>وێنە دروست بکە</small>

          </button>

          <button class="action-card" data-action="write">

            <span class="action-icon">✎</span>

            <strong>نووسین</strong>

            <small>پەیامی نووسین</small>

          </button>

          <button class="action-card" data-action="translate">

            <span class="action-icon">A文</span>

            <strong>وەرگێڕان</strong>

            <small>وەرگێڕانی دەق</small>

          </button>

          <button class="action-card" data-action="read">

            <span class="action-icon">📖</span>

            <strong>پەرتەی خوێندن</strong>

            <small>فێربوون و خوێندن</small>

          </button>

          <button class="action-card" data-action="code">

            <span class="action-icon">&lt;/&gt;</span>

            <strong>کۆدنوسین</strong>

            <small>یارمەتی کۆد</small>

          </button>

          <button class="action-card" data-action="voice">

            <span class="action-icon">🎙️</span>

            <strong>دەنگ</strong>

            <small>گفتوگۆی دەنگی</small>

          </button>

          <button class="action-card" data-action="more">

            <span class="action-icon">☆</span>

            <strong>زیاتر</strong>

            <small>تایبەتمەندی زیاتر</small>

          </button>

        </div>

      </section>

      <!-- PRO -->

      <section class="pro-section">

        <div class="pro-icon">

          ♛

        </div>

        <h2>

          Kurd AI <span>Pro</span>

        </h2>

        <p>

          ئەزموونێکی زیاتر و بەهێزتر

        </p>

        <button class="pro-btn" id="proBtn">

          بینین

        </button>

      </section>

    </main>

    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

      <button class="nav-item active" data-section="home">

        <span class="nav-icon">⌂</span>

        <span>سەرەکی</span>

      </button>

      <button class="nav-item" data-section="history">

        <span class="nav-icon">◷</span>

        <span>مێژوو</span>

      </button>

      <button class="nav-item" data-section="favorites">

        <span class="nav-icon">♡</span>

        <span>دڵخوازەکان</span>

      </button>

      <button class="nav-item" data-section="projects">

        <span class="nav-icon">□</span>

        <span>پڕۆژەکان</span>

      </button>

      <button class="nav-item" data-section="settings">

        <span class="nav-icon">⚙</span>

        <span>ڕێکخستن</span>

      </button>

    </nav>

  </div>

  <!-- TOAST -->

  <div class="toast" id="toast"></div>

  <!-- MODAL -->

  <div class="modal-overlay" id="modalOverlay">

    <div class="modal">

      <button class="modal-close" id="modalClose">

        ×

      </button>

      <div class="modal-icon">

        ✦

      </div>

      <h3 id="modalTitle">

        Kurd AI

      </h3>

      <p id="modalText">

        بەخێربێیت بۆ Kurd AI

      </p>

      <button class="modal-action" id="modalAction">

        باشە

      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
